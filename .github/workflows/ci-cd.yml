name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token WIF exchanges for GCP credentials
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE_NAME }}" \
            --image="$IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,MODEL=${{ vars.GCP_MODEL }},SESSION_BACKEND=firestore,MODEL_ARMOR_TEMPLATE=${{ vars.MODEL_ARMOR_TEMPLATE }},SUPPLY_CHAIN_GRAPH=${{ vars.SUPPLY_CHAIN_GRAPH }}" \
            --set-secrets="APP_API_KEY=app-api-key:latest" \
            --allow-unauthenticated

      - name: Build and push UI image
        run: |
          UI_IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE_NAME }}-ui:${{ github.sha }}"
          docker build -f Dockerfile.ui -t "$UI_IMAGE" .
          docker push "$UI_IMAGE"
          echo "UI_IMAGE=$UI_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy UI to Cloud Run
        run: |
          BACKEND_URL=$(gcloud run services describe "${{ vars.GCP_SERVICE_NAME }}" \
            --region="${{ vars.GCP_REGION }}" --format="value(status.url)")
          gcloud run deploy "${{ vars.GCP_SERVICE_NAME }}-ui" \
            --image="$UI_IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars="API_URL=$BACKEND_URL" \
            --set-secrets="APP_API_KEY=app-api-key:latest" \
            --allow-unauthenticated
